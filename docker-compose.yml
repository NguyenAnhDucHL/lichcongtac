services:
  lichcongtac-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lichcongtac-backend
    expose:
      - "5000"
    ports:
      - "59608:5000"
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - DB_PATH=${DB_PATH}
      - TZ=${TZ}
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_ID_SECRET=${PUBLIC_ID_SECRET}
    volumes:
      - ./data_dump:/app/data
      - ./LichCongTac.Api/Uploads:/app/Uploads
    restart: always

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: lichcongtac-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - lichcongtac-backend
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    container_name: lichcongtac-ngrok
    restart: always
    environment:
      # Lấy Authtoken từ file .env để bảo mật
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: "http --url=freewill-problem-reluctant.ngrok-free.dev --pooling-enabled nginx:80"
    depends_on:
      - nginx
