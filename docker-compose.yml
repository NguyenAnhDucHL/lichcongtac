services:
  lichcongtac-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lichcongtac-backend
    expose:
      - "5000"
    ports:
      - "59608:5000"
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_PATH=/app/data/documents.db
      - TZ=Asia/Ho_Chi_Minh
      - JWT_SECRET=test_secret_for_local_development_123456
      - PUBLIC_ID_SECRET=test_public_id_secret_for_local_development_123456
    volumes:
      - ./data_dump:/app/data
      - ./LichCongTac.Api/Uploads:/app/Uploads
    restart: always

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: lichcongtac-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - lichcongtac-backend
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    container_name: lichcongtac-ngrok
    restart: always
    environment:
      # BẮT BUỘC: Bạn phải dán mã Authtoken của ngrok vào đây (lấy ở trang web ngrok phần Your Authtoken)
      - NGROK_AUTHTOKEN=3HIIbb57LwI4h1S4mkUIaJB89VO_QC67b7qrrLQXEniQXeTQ
    command: "http --url=freewill-problem-reluctant.ngrok-free.dev --pooling-enabled nginx:80"
    depends_on:
      - nginx
